name: Check
on:
  push:
  pull_request:
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
        env:
          TPCH_BROWSER_NETWORK: "1"
  storage-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        duckdb: ["1.0.0", "1.1.3", "1.2.2", "1.3.2", "1.4.5", "1.5.6"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Install released DuckDB CLI
        env:
          DUCKDB_VERSION: ${{ matrix.duckdb }}
        run: curl --fail --silent --show-error https://install.duckdb.org | bash
      - name: Compare native inspection against SQL
        env:
          DUCKDB_VERSION: ${{ matrix.duckdb }}
        run: DUCKDB_COMPAT_BINS="$HOME/.duckdb/cli/$DUCKDB_VERSION/duckdb" bun test tests/compatibility.integration.test.ts
